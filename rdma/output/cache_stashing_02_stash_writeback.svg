<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cache Stashing 后 SSD 读取并最终回写 DDR</title>
  <desc id="desc">RNIC 数据进入 CPU L2 L3 或 LLC，SSD 通过一致性 DMA read 取数，cacheline 不自动失效，后续 dirty eviction 或 flush 回写 DDR。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e8edf0" stroke-width="1"/></pattern>
    <marker id="tealArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2a9698"/></marker>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b43a3a"/></marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7659c8"/></marker>
    <style>
      text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#111}
      .title{font-size:39px;font-weight:700}.sub{font-size:17px;fill:#364152}.box{fill:#fff;stroke:#111;stroke-width:2;rx:8}.cache{fill:#eef7f7;stroke:#111;stroke-width:2;rx:8}.gray{fill:#e9eef0;stroke:#87929a;stroke-width:2;stroke-dasharray:8 6;rx:8}.head{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#28323b}.pill{fill:#4f5961;rx:17}.pillText{font-size:18px;fill:#fff;font-weight:700}.teal{stroke:#2a9698;stroke-width:4;fill:none;marker-end:url(#tealArrow)}.red{stroke:#b43a3a;stroke-width:3;stroke-dasharray:9 7;fill:none;marker-end:url(#redArrow)}.purple{stroke:#7659c8;stroke-width:3;fill:none;marker-end:url(#purpleArrow)}.note{font-size:17px;font-weight:700}.bottom{font-size:16px;fill:#111}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <text class="title" x="60" y="58">Cache Stashing: SSD Read Hit + Dirty Writeback</text>
  <text class="title" x="60" y="103">Read From L3 Does Not Mean Read-and-Invalidate</text>

  <rect class="box" x="60" y="265" width="235" height="190"/>
  <text class="head" x="178" y="345" text-anchor="middle">RNIC / DPU</text>
  <text class="body" x="178" y="380" text-anchor="middle">inbound DMA write</text>
  <text class="body" x="178" y="408" text-anchor="middle">packet CRC</text>
  <rect x="115" y="425" width="126" height="15" fill="#2a9698"/>
  <text class="small" x="178" y="483" text-anchor="middle">newest payload in cache</text>

  <rect class="box" x="365" y="265" width="255" height="190"/>
  <text class="head" x="493" y="330" text-anchor="middle">PCIe Root Complex</text>
  <text class="head" x="493" y="360" text-anchor="middle">(DDIO / TPH)</text>
  <text class="body" x="493" y="398" text-anchor="middle">I/O coherence</text>
  <text class="small" x="493" y="428" text-anchor="middle">LLC allocation / target</text>
  <line class="teal" x1="295" y1="360" x2="365" y2="360"/>

  <rect class="cache" x="695" y="245" width="315" height="230"/>
  <text class="head" x="853" y="310" text-anchor="middle">CPU Core &amp;</text>
  <text class="head" x="853" y="340" text-anchor="middle">L2 / L3 Cache</text>
  <text class="body" x="853" y="380" text-anchor="middle">valid + dirty/modified</text>
  <text class="body" x="853" y="412" text-anchor="middle">DDR backing 可能旧</text>
  <text class="small" x="853" y="450" text-anchor="middle">SSD read 不自动失效</text>
  <line class="teal" x1="620" y1="360" x2="695" y2="360"/>

  <rect class="box" x="1280" y="265" width="255" height="190"/>
  <text class="head" x="1408" y="330" text-anchor="middle">NVMe SSD</text>
  <text class="head" x="1408" y="360" text-anchor="middle">Controller</text>
  <text class="body" x="1408" y="398" text-anchor="middle">coherent DMA read</text>
  <text class="small" x="1408" y="428" text-anchor="middle">→ controller buffer → NAND</text>
  <line class="purple" x1="1010" y1="360" x2="1280" y2="360"/>
  <text class="note" x="1145" y="330" text-anchor="middle">Outbound read hit</text>

  <rect class="gray" x="1040" y="145" width="230" height="160"/>
  <text class="head" x="1155" y="205" text-anchor="middle">Host DDR DRAM</text>
  <text class="body" x="1155" y="238" text-anchor="middle">backing memory</text>
  <text class="small" x="1155" y="270" text-anchor="middle">dirty writeback</text>
  <rect class="pill" x="1055" y="315" width="200" height="36"/>
  <text class="pillText" x="1155" y="340" text-anchor="middle">DRAM Read = 0</text>

  <path class="red" d="M850 475C930 515 1010 560 1090 600"/>
  <text class="note" x="1010" y="555" fill="#b43a3a">eviction / flush / reclaim</text>
  <rect class="gray" x="1050" y="565" width="220" height="110"/>
  <text class="body" x="1160" y="610" text-anchor="middle">Dirty line</text>
  <text class="body" x="1160" y="640" text-anchor="middle">→ DDR writeback</text>
  <rect class="pill" x="1038" y="690" width="245" height="36"/>
  <text class="pillText" x="1160" y="715" text-anchor="middle">Full life: ≈ 1× DDR Write</text>

  <rect class="box" x="695" y="535" width="315" height="110"/>
  <text class="head" x="853" y="578" text-anchor="middle">CPU Process</text>
  <text class="body" x="853" y="610" text-anchor="middle">CRC / Decompress / KV metadata</text>
  <path class="teal" d="M853 535L853 475"/>
  <rect class="pill" x="735" y="660" width="235" height="36"/>
  <text class="pillText" x="853" y="685" text-anchor="middle">Hot window: DDR Read = 0</text>

  <rect x="60" y="760" width="1475" height="80" fill="#eef2f3" stroke="#929ba2" stroke-width="1.5" rx="5"/>
  <text class="note" x="85" y="792">Key semantics</text>
  <text class="bottom" x="210" y="792">SSD 取走数据 ≠ cacheline 自动失效；普通 coherent DMA read 只读取最新副本，后续 dirty eviction 仍可能回写 DDR。</text>
  <text class="small" x="85" y="820">L3 hot 的 0 DDR 只适用于关键窗口；完整生命周期需计入 dirty writeback，除非另有显式 discard 语义。</text>
</svg>
