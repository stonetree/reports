<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">条件化的 Zero DDR Writeback Cache Stashing 路径</title>
  <desc id="desc">在显式 read-and-invalidate 或 dirty-discard ownership transfer、DMA completion 和 buffer 生命周期闭合的前提下，cacheline 可失效而不回写 DDR。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e8edf0" stroke-width="1"/></pattern>
    <marker id="tealArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2a9698"/></marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7659c8"/></marker>
    <marker id="darkArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3e4850"/></marker>
    <style>
      text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#111}
      .title{font-size:39px;font-weight:700}.sub{font-size:17px;fill:#364152}.box{fill:#fff;stroke:#111;stroke-width:2;rx:8}.cache{fill:#eef7f7;stroke:#111;stroke-width:2;rx:8}.gray{fill:#e9eef0;stroke:#87929a;stroke-width:2;stroke-dasharray:8 6;rx:8}.head{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#28323b}.pill{fill:#4f5961;rx:17}.greenPill{fill:#2f8a67;rx:17}.pillText{font-size:18px;fill:#fff;font-weight:700}.teal{stroke:#2a9698;stroke-width:4;fill:none;marker-end:url(#tealArrow)}.purple{stroke:#7659c8;stroke-width:3;fill:none;marker-end:url(#purpleArrow)}.dark{stroke:#3e4850;stroke-width:3;fill:none;marker-end:url(#darkArrow)}.note{font-size:17px;font-weight:700}.bottom{font-size:16px;fill:#111}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <text class="title" x="60" y="58">Conditional Zero-DDR Writeback Data Path</text>
  <text class="title" x="60" y="103">Read-and-Invalidate / Dirty-Discard Semantics</text>

  <rect class="box" x="60" y="265" width="235" height="190"/>
  <text class="head" x="178" y="345" text-anchor="middle">RNIC / DPU</text>
  <text class="body" x="178" y="380" text-anchor="middle">full-line coherent DMA</text>
  <text class="body" x="178" y="408" text-anchor="middle">CRC · fence · CQE</text>
  <rect x="115" y="425" width="126" height="15" fill="#2a9698"/>
  <text class="small" x="178" y="483" text-anchor="middle">MR · IOVA · order</text>

  <rect class="box" x="365" y="265" width="255" height="190"/>
  <text class="head" x="493" y="330" text-anchor="middle">PCIe Root Complex</text>
  <text class="head" x="493" y="360" text-anchor="middle">(TPH / Coherent I/O)</text>
  <text class="body" x="493" y="398" text-anchor="middle">Steering Tag = hint</text>
  <text class="small" x="493" y="428" text-anchor="middle">not a discard primitive</text>
  <line class="teal" x1="295" y1="360" x2="365" y2="360"/>

  <rect class="cache" x="695" y="245" width="315" height="230"/>
  <text class="head" x="853" y="310" text-anchor="middle">CPU Core &amp;</text>
  <text class="head" x="853" y="340" text-anchor="middle">L2 / L3 Cache</text>
  <text class="body" x="853" y="380" text-anchor="middle">latest dirty payload</text>
  <text class="body" x="853" y="412" text-anchor="middle">等待 SSD read completion</text>
  <text class="small" x="853" y="450" text-anchor="middle">之后显式变为 INVALID</text>
  <line class="teal" x1="620" y1="360" x2="695" y2="360"/>

  <rect class="box" x="1280" y="265" width="255" height="190"/>
  <text class="head" x="1408" y="330" text-anchor="middle">NVMe SSD</text>
  <text class="head" x="1408" y="360" text-anchor="middle">Controller</text>
  <text class="body" x="1408" y="398" text-anchor="middle">coherent DMA read</text>
  <text class="small" x="1408" y="428" text-anchor="middle">CMB / PMR → NAND</text>
  <line class="purple" x1="1010" y1="360" x2="1280" y2="360"/>
  <text class="note" x="1145" y="330" text-anchor="middle">Read-and-Invalidate DMA</text>

  <rect class="gray" x="1070" y="145" width="240" height="150"/>
  <text class="head" x="1190" y="205" text-anchor="middle">Host DDR DRAM</text>
  <text class="body" x="1190" y="238" text-anchor="middle">payload backing</text>
  <text class="small" x="1190" y="270" text-anchor="middle">writeback eliminated</text>
  <line x1="1100" y1="170" x2="1280" y2="270" stroke="#c23636" stroke-width="5"/>
  <line x1="1280" y1="170" x2="1100" y2="270" stroke="#c23636" stroke-width="5"/>
  <rect class="greenPill" x="1080" y="310" width="220" height="36"/>
  <text class="pillText" x="1190" y="335" text-anchor="middle">DDR Write = 0*</text>

  <path class="dark" d="M853 475C853 520 853 545 853 580"/>
  <rect class="box" x="695" y="580" width="315" height="90"/>
  <text class="head" x="853" y="618" text-anchor="middle">Cacheline state transition</text>
  <text class="body" x="853" y="648" text-anchor="middle">valid + dirty → INVALID / dropped</text>
  <rect class="pill" x="735" y="690" width="235" height="36"/>
  <text class="pillText" x="853" y="715" text-anchor="middle">DRAM Read = 0</text>

  <rect x="60" y="760" width="1475" height="90" fill="#eef2f3" stroke="#929ba2" stroke-width="1.5" rx="5"/>
  <text class="note" x="85" y="792">Protocol Semantics / Mandatory Dependencies</text>
  <text class="bottom" x="85" y="820">full-line coherent DMA · SSD DMA completion + fence · buffer lifetime closed · no future CPU/other-DMA reader</text>
  <text class="small" x="85" y="842">*仅当平台/驱动确实提供 dirty-discard 或 read-and-invalidate ownership transfer；普通 PCIe DMA read、TPH/Steering Tag 不自动提供。</text>
</svg>
